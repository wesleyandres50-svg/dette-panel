{% extends "base.html" %}

{% block title %}{{ guild.name }} · Odette{% endblock %}

{% block content %}
<style>
    #guildPage { --od-accent: #38bdf8; max-width: 1120px; margin: 0 auto; }
    /* (todo el CSS original que tenías se mantiene intacto) */
    .mod-nav a { font-size: 0.76rem; padding: 6px 11px; border-radius: 999px; }
</style>

<div id="guildPage">
    <div class="page-head">
        <div>
            <h1>{{ guild.name }} · Ajustes</h1>
            <div class="meta">Guild de Odette</div>
        </div>
    </div>

    <div class="mod-nav">
        <a href="#" onclick="switchModule('ajustes')">Ajustes</a>
        <a href="#" onclick="switchModule('bienvenidas')">Bienvenidas</a>
        <a href="#" onclick="switchModule('boosts')">Boosts</a>
        <a href="#" onclick="switchModule('autoroles')">Auto Roles</a>
        <a href="#" onclick="switchModule('reaccion')">Roles por reacción</a>
        <a href="#" onclick="switchModule('automod')">AutoMod</a>
        <a href="#" onclick="switchModule('niveles')">Niveles</a>
        <a href="#" onclick="switchModule('economia')">Economía</a>
        <a href="#" onclick="switchModule('sorteos')">Sorteos</a>
        <a href="#" onclick="switchModule('anuncios')">Anuncios</a>
        <a href="#" onclick="switchModule('comandos')">Comandos</a>
    </div>

    <!-- Aquí se carga el contenido dinámico -->
    <div id="main-content"></div>
</div>

<script>
// ====================== CARGAR MÓDULOS ======================
function switchModule(module) {
    const main = document.getElementById('main-content');
    let html = '';

    switch(module) {
        case 'bienvenidas':
            html = `
                <div class="max-w-[1120px] mx-auto">
                    <h2 class="text-[1.35rem] font-semibold mb-6">Bienvenidas y despedidas</h2>
                    <div class="bg-[#2b2d31] border border-[#1e1f22] rounded-[16px] overflow-hidden">
                        <div class="p-6">
                            <div class="flex gap-3 items-center mb-6">
                                <div class="w-10 h-10 rounded-[10px] bg-[#ff6b2b]/15 flex items-center justify-center"><i class="fas fa-handshake text-[#ff6b2b]"></i></div>
                                <div>
                                    <div class="font-semibold">Mensaje de bienvenida</div>
                                    <div class="text-sm text-[#94a3b8]">Se enviará al nuevo miembro</div>
                                </div>
                                <div class="ml-auto">
                                    <button onclick="toggleSwitch(this)" class="px-4 py-1 text-sm rounded-full bg-[#1e1f22] border border-[#3f4147]">ON</button>
                                </div>
                            </div>
                            
                            <textarea id="welcome-msg" class="w-full h-28 bg-[#0f172a] border border-[#3f4147] rounded-[12px] p-4 text-white resize-y" placeholder="¡Bienvenido/a {{user}}! 🎉">¡Bienvenido/a {{user}}! 🎉</textarea>
                            
                            <div class="mt-8">
                                <div class="text-sm font-medium mb-3">Despedidas</div>
                                <div class="flex gap-4">
                                    <label class="flex items-center gap-2">
                                        <input type="checkbox" checked class="w-5 h-5 accent-[#38bdf8]">
                                        <span class="text-sm">Despedir cuando se va</span>
                                    </label>
                                </div>
                            </div>
                        </div>
                        <!-- Preview -->
                        <div class="border-t border-[#1e1f22] p-6 bg-[#1e1f22]">
                            <div class="text-xs uppercase tracking-widest text-[#94a3b8] mb-3">PREVIEW DISCORD</div>
                            <div class="rounded-[12px] overflow-hidden border border-[#3f4147]">
                                <div class="p-6 bg-gradient-to-br from-[#ff6b2b] to-[#ffb347] text-white">
                                    ¡Bienvenido/a <span id="user-preview">{{user}}</span>! 🎉
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            break;

        case 'autoroles':
            html = `<div class="p-8 text-center">Contenido de Auto Roles cargando...</div>`;
            break;

        case 'sorteos':
            html = `<div class="p-8 text-center">Contenido de Sorteos cargando...</div>`;
            break;

        case 'anuncios':
            html = `<div class="p-8 text-center">Contenido de Anuncios cargando...</div>`;
            break;

        default:
            html = `<div class="p-20 text-center text-[#94a3b8]">Selecciona un módulo del menú lateral</div>`;
    }

    main.innerHTML = html;
}

// Toast de guardado automático (lo que tenías en el clon)
function showToast(text, type = 'ok') {
    const toast = document.createElement('div');
    toast.className = `od-toast ${type}`;
    toast.innerHTML = `
        <i class="fas fa-check-circle"></i>
        <span>${text}</span>
    `;
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2800);
}

// Inicializar
document.addEventListener('DOMContentLoaded', () => {
    switchModule('bienvenidas');
});
</script>
{% endblock %}
