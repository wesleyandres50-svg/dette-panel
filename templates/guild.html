<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Odette • Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%); }
    .card {
      background: rgba(26, 26, 26, 0.95);
      border: 1px solid rgba(255, 140, 66, 0.15);
      transition: all 0.4s cubic-bezier(0.4, 0.0, 0.2, 1);
    }
    .card:hover {
      transform: translateY(-12px);
      border-color: rgb(255 140 66);
      box-shadow: 0 30px 60px -15px rgb(255 140 66 / 0.2);
    }
    .nav-tab {
      position: relative;
    }
    .nav-tab.active:after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgb(255 140 66);
    }
    .server-list { scrollbar-width: thin; scrollbar-color: #64748b #1f1f1f; }
  </style>
</head>
<body class="text-white min-h-screen">
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar (exacto como la foto) -->
    <div class="w-72 bg-zinc-950 border-r border-zinc-800 flex flex-col">
      <div class="p-6 flex items-center gap-3">
        <div class="w-10 h-10 bg-orange-500 rounded-2xl flex items-center justify-center text-3xl shadow-lg">🐙</div>
        <div class="text-3xl font-bold tracking-tighter">Odette</div>
      </div>
      <div class="px-4 mt-2">
        <div onclick="switchTab(0)" class="nav-tab active flex items-center gap-3 px-4 py-3 text-sm font-medium cursor-pointer">
          <i class="fa-solid fa-house w-5"></i> Dashboard
        </div>
        <div onclick="switchTab(1)" class="nav-tab flex items-center gap-3 px-4 py-3 text-sm font-medium cursor-pointer mt-1">
          <i class="fa-solid fa-shield-halved w-5"></i> Moderación
        </div>
        <div onclick="switchTab(2)" class="nav-tab flex items-center gap-3 px-4 py-3 text-sm font-medium cursor-pointer mt-1">
          <i class="fa-solid fa-robot w-5"></i> Automatización
        </div>
        <div onclick="switchTab(3)" class="nav-tab flex items-center gap-3 px-4 py-3 text-sm font-medium cursor-pointer mt-1">
          <i class="fa-solid fa-bug w-5"></i> Automod Avanzado <span class="text-amber-400 text-xs">(Premium)</span>
        </div>
        <div onclick="switchTab(4)" class="nav-tab flex items-center gap-3 px-4 py-3 text-sm font-medium cursor-pointer mt-1">
          <i class="fa-solid fa-users w-5"></i> Miembros
        </div>
      </div>
      <div class="mt-auto p-6">
        <div class="bg-zinc-900 rounded-3xl p-5 text-xs">
          <div class="flex justify-between text-orange-300 mb-3">
            <span>Tier 5 • 15 servidores</span>
            <span class="text-amber-400">Premium</span>
          </div>
          <button onclick="upgrade()" class="w-full py-3 bg-orange-500 hover:bg-orange-400 rounded-3xl text-sm font-medium">Gestionar suscripciones</button>
        </div>
      </div>
    </div>

    <!-- Main -->
    <div class="flex-1 overflow-auto">
      <header class="h-16 bg-zinc-950 border-b border-zinc-800 flex items-center px-8 justify-between">
        <input type="text" placeholder="Buscar ajuste, sistema, comando..." 
               class="bg-zinc-900 border border-zinc-700 focus:border-orange-400 rounded-3xl px-6 py-2 w-96 text-sm outline-none">
        <div class="flex items-center gap-6">
          <button onclick="refreshServers()" class="flex items-center gap-2 text-sm hover:text-orange-300">
            <i class="fa-solid fa-rotate"></i> Actualizar
          </button>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="font-medium">misosoppy</div>
              <div class="text-emerald-400 text-xs">Online • 1 servidor activo</div>
            </div>
            <div class="w-9 h-9 bg-gradient-to-br from-orange-500 to-amber-500 rounded-2xl flex items-center justify-center text-xl">👤</div>
          </div>
        </div>
      </header>

      <!-- Servidores -->
      <div class="p-8">
        <div class="flex justify-between items-end mb-8">
          <h2 class="text-4xl font-bold">Servidores</h2>
          <button onclick="inviteOka()" class="px-7 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-3xl flex items-center gap-2 text-sm">
            <i class="fa-solid fa-plus"></i> Invitar a Odette
          </button>
        </div>

        <div id="servers-grid" class="grid grid-cols-4 gap-6 server-list max-h-[calc(100vh-180px)] overflow-auto">
          <!-- Se llena con JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Premium -->
  <div id="premium-modal" onclick="if(event.target.id==='premium-modal') hideModal()" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[999]">
    <div onclick="event.stopImmediatePropagation()" class="bg-zinc-900 rounded-3xl p-10 max-w-lg w-full">
      <h3 class="text-2xl font-bold mb-2">Automod Avanzado • Solo Premium</h3>
      <p class="text-zinc-400 mb-8">IA + detección ultra-agresiva de spam y raid en tiempo real.</p>
      <button onclick="hideModal()" class="w-full py-4 bg-orange-500 hover:bg-orange-400 rounded-3xl text-lg font-medium">Ver planes Premium</button>
    </div>
  </div>

  <script>
    const servers = [
      { id: "11", name: "111111", icon: "https://picsum.photos/id/64/128", online: true, owner: true },
      { id: "pizza", name: "Capa's Pizzeria", icon: "https://picsum.photos/id/201/128", online: true },
      { id: "copy", name: "copia capas actualizada", icon: "https://picsum.photos/id/180/128", online: false },
      { id: "fvcked", name: "FVCKED BY lidest", icon: "https://picsum.photos/id/251/128", online: false },
      { id: "secret", name: "Secret", icon: "https://picsum.photos/id/30/128", online: false }
    ];

    function renderServers() {
      const grid = document.getElementById('servers-grid');
      grid.innerHTML = '';
      servers.forEach(s => {
        const div = document.createElement('div');
        div.className = `card rounded-3xl p-6 cursor-pointer ${s.online ? 'border-emerald-500' : ''}`;
        div.innerHTML = `
          <div class="flex items-center gap-4">
            <img src="${s.icon}" class="w-14 h-14 rounded-2xl object-cover">
            <div>
              <div class="font-semibold text-lg">${s.name}</div>
              <div class="text-xs text-zinc-400">ID: ${s.id}</div>
            </div>
          </div>
          ${s.online ? `<div class="mt-4 text-emerald-400 text-xs flex items-center gap-1"><i class="fa-solid fa-circle"></i> En línea</div>` : ''}
        `;
        grid.appendChild(div);
      });
    }

    function switchTab(n) {
      document.querySelectorAll('.nav-tab').forEach((el, i) => el.classList.toggle('active', i === n));
      if (n === 3) document.getElementById('premium-modal').classList.remove('hidden');
    }

    function refreshServers() { renderServers(); }
    function inviteOka() { alert("✅ Panel de invitación a Odette abierto"); }
    function upgrade() { document.getElementById('premium-modal').classList.remove('hidden'); }
    function hideModal() { document.getElementById('premium-modal').classList.add('hidden'); }

    window.onload = () => {
      renderServers();
    };
  </script>
</body>
</html>
