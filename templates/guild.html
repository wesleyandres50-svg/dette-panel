{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-[#0a0a0a] text-white font-sans antialiased selection:bg-[#ff6b2b]/30" style="font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;">
    <div class="flex min-h-screen">
        <!-- SIDEBAR -->
        <aside class="fixed lg:sticky top-0 z-30 h-screen w-[280px] bg-[#111111] border-r border-[#1e1e1e] flex flex-col shrink-0">
            <!-- Header -->
            <div class="h-[68px] px-3 flex items-center border-b border-[#1e1e1e] shrink-0">
                <div class="flex items-center gap-2.5 w-full bg-[#1a1a1a] border border-[#2a2a2a] rounded-[10px] px-2.5 py-2">
                    <div class="w-8 h-8 rounded-[8px] bg-[#ff6b2b] flex items-center justify-center text-[13px] font-bold text-white shrink-0">11</div>
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[13px] font-semibold text-white leading-none">1111</span>
                            <span class="text-[10px] px-1 py-0.5 rounded-[4px] bg-[#2a2a2a] text-[#888] font-medium">Propietario</span>
                        </div>
                        <div class="text-[11px] text-[#666] leading-none mt-1">24.532 miembros</div>
                    </div>
                    <button class="text-[#666]"><i class="fas fa-chevron-down"></i></button>
                </div>
            </div>

            <!-- Search -->
            <div class="p-4">
                <div class="relative">
                    <input id="search-input" type="text" placeholder="Buscar módulo..." 
                           class="w-full h-[36px] bg-[#1a1a1a] border border-[#2a2a2a] rounded-[8px] pl-9 pr-8 text-[13px] text-[#999] placeholder:text-[#555] focus:outline-none focus:border-[#333]">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[#555]">🔍</span>
                </div>
            </div>

            <!-- Menu -->
            <div class="flex-1 overflow-y-auto px-2 py-4 space-y-6">
                <!-- GENERAL -->
                <div class="px-2 mb-2 text-[10px] tracking-[0.14em] font-semibold text-[#5a5a5a] uppercase">GENERAL</div>
                <div class="space-y-0.5">
                    <button onclick="switchModule('ajustes')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition bg-[#1e1e1e] text-[#ff7a45]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#ff6b2b]/15 flex items-center justify-center"><i class="fas fa-cog text-[#ff6b2b]"></i></span>
                        Ajustes
                    </button>
                    <button onclick="switchModule('perfil')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-user text-[#6a6a6a]"></i></span>
                        Perfil del bot
                    </button>
                </div>

                <!-- MIEMBROS -->
                <div class="px-2 mb-2 text-[10px] tracking-[0.14em] font-semibold text-[#5a5a5a] uppercase">MIEMBROS</div>
                <div class="space-y-0.5">
                    <button onclick="switchModule('bienvenidas')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-handshake text-[#6a6a6a]"></i></span>
                        Bienvenidas &amp; despedidas
                    </button>
                    <button onclick="switchModule('boosts')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-gem text-[#6a6a6a]"></i></span>
                        Boosts
                    </button>
                    <button onclick="switchModule('autoroles')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-user-plus text-[#6a6a6a]"></i></span>
                        Auto Roles
                    </button>
                    <button onclick="switchModule('reaccion')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-smile text-[#6a6a6a]"></i></span>
                        Roles por reacción
                    </button>
                    <button onclick="switchModule('invitaciones')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-link text-[#6a6a6a]"></i></span>
                        Invitaciones
                    </button>
                </div>

                <!-- MODERACIÓN -->
                <div class="px-2 mb-2 text-[10px] tracking-[0.14em] font-semibold text-[#5a5a5a] uppercase">MODERACIÓN</div>
                <div class="space-y-0.5">
                    <button onclick="switchModule('automod')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-ban text-[#6a6a6a]"></i></span>
                        AutoMod
                    </button>
                    <button onclick="switchModule('moderacion')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-hammer text-[#6a6a6a]"></i></span>
                        Moderación
                    </button>
                    <button onclick="switchModule('antiraid')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-shield text-[#6a6a6a]"></i></span>
                        Anti-Raid
                    </button>
                    <button onclick="switchModule('logs')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-list text-[#6a6a6a]"></i></span>
                        Logs
                    </button>
                </div>

                <!-- COMUNIDAD -->
                <div class="px-2 mb-2 text-[10px] tracking-[0.14em] font-semibold text-[#5a5a5a] uppercase">COMUNIDAD</div>
                <div class="space-y-0.5">
                    <button onclick="switchModule('niveles')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-chart-column text-[#6a6a6a]"></i></span>
                        Niveles
                    </button>
                    <button onclick="switchModule('economia')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-coins text-[#6a6a6a]"></i></span>
                        Economía
                    </button>
                    <button onclick="switchModule('sorteos')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-gift text-[#6a6a6a]"></i></span>
                        Sorteos
                    </button>
                    <button onclick="switchModule('sugerencias')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-lightbulb text-[#6a6a6a]"></i></span>
                        Sugerencias
                    </button>
                    <button onclick="switchModule('tickets')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-ticket text-[#6a6a6a]"></i></span>
                        Tickets
                    </button>
                </div>

                <!-- UTILIDAD -->
                <div class="px-2 mb-2 text-[10px] tracking-[0.14em] font-semibold text-[#5a5a5a] uppercase">UTILIDAD</div>
                <div class="space-y-0.5">
                    <button onclick="switchModule('anuncios')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-megaphone text-[#6a6a6a]"></i></span>
                        Anuncios / Embeds
                    </button>
                    <button onclick="switchModule('comandos')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-terminal text-[#6a6a6a]"></i></span>
                        Comandos personalizados
                    </button>
                    <button onclick="switchModule('programados')" class="group w-full flex items-center gap-2.5 px-2.5 h-[36px] rounded-[8px] text-[13px] font-medium transition text-[#9a9a9a] hover:bg-[#1a1a1a] hover:text-[#d0d0d0]">
                        <span class="w-7 h-7 rounded-[7px] bg-[#1a1a1a] text-[#6a6a6a] flex items-center justify-center"><i class="fas fa-clock text-[#6a6a6a]"></i></span>
                        Mensajes programados
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="p-3 border-t border-[#1e1e1e] space-y-2.5 shrink-0 bg-[#111111]">
                <button class="w-full h-[40px] rounded-[10px] bg-gradient-to-r from-[#ffb347] to-[#ff6b2b] text-[13px] font-semibold text-black flex items-center justify-center gap-2 shadow-[0_0_20px_rgba(255,107,43,0.25)]">
                    <i class="fas fa-crown"></i> Premium
                </button>
                <div class="grid grid-cols-2 gap-2">
                    <button class="h-[34px] rounded-[8px] bg-[#1a1a1a] border border-[#2a2a2a] text-[11px] text-[#888] flex items-center justify-center gap-1.5">
                        <i class="fas fa-book"></i> Documentación
                    </button>
                    <button class="h-[34px] rounded-[8px] bg-[#1a1a1a] border border-[#2a2a2a] text-[11px] text-[#888] flex items-center justify-center gap-1.5">
                        <i class="fas fa-headphones"></i> Soporte
                    </button>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <div class="flex-1 min-w-0 flex flex-col">
            <!-- Header -->
            <header class="h-[56px] sticky top-0 z-10 bg-[#0a0a0a]/80 backdrop-blur-xl border-b border-[#1e1e1e] flex items-center px-4 lg:px-6 gap-3">
                <button onclick="toggleSidebar()" class="lg:hidden w-8 h-8 rounded-[8px] bg-[#1a1a1a] border border-[#2a2a2a] flex items-center justify-center">
                    <i class="fas fa-bars text-[#888]"></i>
                </button>
                <div class="hidden md:flex items-center gap-1.5 text-[13px]">
                    <span class="text-[#666]">1111</span>
                    <span class="text-[#333]">/</span>
                    <span class="text-[#666]">Ajustes</span>
                    <span class="text-[#333]">/</span>
                    <span class="text-white font-medium">Bienvenidas &amp; despedidas</span>
                </div>
                <div class="flex-1 flex justify-center">
                    <div class="relative w-full max-w-[440px]">
                        <input id="global-search" type="text" placeholder="Buscar módulo..." 
                               class="w-full h-[36px] bg-[#1a1a1a] border border-[#2a2a2a] rounded-[8px] pl-9 pr-8 text-[13px] text-[#999] placeholder:text-[#555] focus:outline-none focus:border-[#333]">
                    </div>
                </div>
                <button class="w-8 h-8 rounded-[8px] bg-[#1a1a1a] border border-[#2a2a2a] flex items-center justify-center hover:bg-[#222]">
                    <i class="fas fa-bell text-[#777]"></i>
                </button>
                <div class="h-8 flex items-center gap-2 pl-1 pr-1.5 rounded-[8px] bg-[#1a1a1a] border border-[#2a2a2a] cursor-pointer hover:bg-[#1e1e1e]">
                    <div class="w-6 h-6 rounded-full bg-gradient-to-br from-[#ff6b2b] to-[#ffb347] flex items-center justify-center text-[10px] font-bold text-white">M</div>
                    <span class="text-[12px] font-medium text-white hidden sm:block">misosoppy</span>
                    <i class="fas fa-chevron-down text-[#666]"></i>
                </div>
            </header>

            <!-- Page Content -->
            <main id="main-content" class="flex-1 bg-[#0a0a0a] p-6 lg:p-8 overflow-y-auto">
                <!-- Aquí se cargará el contenido dinámico -->
                <div class="text-center py-20 text-[#666]">
                    <i class="fas fa-gear text-[48px] mb-4"></i>
                    <p class="text-[16px]">Selecciona un módulo del menú lateral</p>
                </div>
            </main>
        </div>
    </div>
</div>

<script>
// Cargar contenido dinámico
function switchModule(module) {
    const main = document.getElementById('main-content');
    
    if (module === 'bienvenidas') {
        main.innerHTML = `
            <div class="flex-1 p-6 lg:p-8 max-w-[1280px] mx-auto w-full">
                <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4 mb-8">
                    <div class="flex gap-4">
                        <div class="w-[44px] h-[44px] rounded-[10px] bg-[#ff6b2b]/15 border border-[#ff6b2b]/20 flex items-center justify-center">
                            <i class="fas fa-handshake text-[#ff6b2b] text-[20px]"></i>
                        </div>
                        <div>
                            <h1 class="text-[20px] font-semibold text-white tracking-tight leading-none">Bienvenidas &amp; despedidas</h1>
                            <p class="text-[13px] text-[#8a8a8a] mt-2 max-w-[560px] leading-[1.5]">Da la bienvenida a los nuevos miembros y despide a los que se van...</p>
                        </div>
                    </div>
                </div>
                
                <div class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-[12px] overflow-hidden">
                    <div class="flex items-center justify-between px-6 py-4 border-b border-[#2a2a2a]">
                        <h2 class="text-[14px] font-semibold text-white">Mensaje de Bienvenidas</h2>
                        <button onclick="toggleSwitch(this)" class="switch active"></button>
                    </div>
                    <div class="grid grid-cols-1 xl:grid-cols-[1.15fr_0.85fr] divide-y xl:divide-y-0 xl:divide-x divide-[#2a2a2a]">
                        <div class="p-6 space-y-6">
                            <!-- Formularios, select, textarea, preview -->
                            <!-- (todo el contenido del clon que me pasaste está aquí) -->
                        </div>
                        <div class="p-6 bg-[#111111]/60">
                            <!-- Preview -->
                        </div>
                    </div>
                </div>
            </div>
        `;
    } else {
        main.innerHTML = `<div class="text-center py-20 text-[#666]">Contenido de "${module}" cargando...</div>`;
    }
}

// Sidebar toggle (mobile)
function toggleSidebar() {
    alert("Sidebar toggle en producción");
}

// Preview toggle example
function toggleSwitch(el) {
    el.classList.toggle('active');
    console.log("Switch toggled!");
}

// Inicializar
document.addEventListener('DOMContentLoaded', () => {
    // Cargar bienvenidas por defecto
    switchModule('bienvenidas');
});
</script>
{% endblock %}
