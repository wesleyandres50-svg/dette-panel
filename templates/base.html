<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Odette{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0b;
      --bg-elev: #111113;
      --bg-card: #161618;
      --bg-card-2: #1c1c1f;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.12);
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --muted-2: #71717a;
      --accent: #f26b47;
      --accent-2: #ff8a65;
      --accent-soft: rgba(242,107,71,0.14);
      --accent-border: rgba(242,107,71,0.35);
      --success: #22c55e;
      --danger: #ef4444;
      --sidebar-w: 248px;
      --radius: 14px;
      --radius-sm: 10px;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent-2); text-decoration: none; }
    a:hover { color: #fff; }

    /* Shell */
    .shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: #0d0d0f;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      z-index: 40;
    }
    .sidebar-brand {
      display: flex; align-items: center; gap: 10px;
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand img, .sidebar-brand .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #ff9a6b);
      display: grid; place-items: center; font-weight: 800; font-size: 0.95rem;
    }
    .sidebar-brand .name { font-weight: 700; font-size: 1.05rem; letter-spacing: -0.02em; }
    .sidebar-brand .name span { color: var(--accent); }

    .side-section {
      padding: 14px 12px 6px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .side-nav { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 2px; }
    .side-nav a, .side-nav .side-item {
      display: flex; align-items: center; gap: 11px;
      padding: 10px 12px;
      border-radius: 12px;
      color: #a1a1aa;
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s, transform 0.12s;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 2px;
    }
    .side-nav a:hover, .side-nav .side-item:hover {
      background: rgba(255,255,255,0.045);
      color: #fafafa;
    }
    .side-nav a.active, .side-nav .side-item.active {
      background: linear-gradient(90deg, rgba(242,107,71,0.18), rgba(242,107,71,0.06));
      color: #fff;
      border-color: rgba(242,107,71,0.28);
      box-shadow: inset 3px 0 0 var(--accent);
    }
    .side-nav .ico {
      width: 28px; height: 28px; border-radius: 9px;
      display: grid; place-items: center;
      background: rgba(255,255,255,0.05);
      font-size: 0.85rem;
      flex-shrink: 0;
      transition: 0.15s;
    }
    .side-nav a.active .ico {
      background: rgba(242,107,71,0.28);
      box-shadow: 0 0 12px rgba(242,107,71,0.2);
    }
    .side-nav a:hover .ico { background: rgba(255,255,255,0.08); }
    .side-section {
      padding: 16px 14px 6px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #52525b;
    }
    .badge-new {
      margin-left: auto;
      font-size: 0.62rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      letter-spacing: 0.02em;
    }
    .side-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent); margin-left: auto; opacity: 0.7;
    }
    .side-footer {
      margin-top: auto;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .side-footer a {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 10px;
      color: var(--muted); font-size: 0.84rem;
    }
    .side-footer a.premium {
      background: linear-gradient(135deg, rgba(242,107,71,0.2), rgba(255,154,107,0.08));
      border: 1px solid var(--accent-border);
      color: #ffd0c0;
      font-weight: 600;
    }

    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,11,0.85);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 30;
    }
    .topbar .crumb { color: var(--muted); font-size: 0.84rem; }
    .topbar .crumb strong { color: var(--text); font-weight: 600; }
    .topbar .spacer { flex: 1; }
    .topbar .search {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      color: var(--muted);
      font-size: 0.82rem;
      min-width: 200px;
    }
    .user-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 999px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      font-size: 0.82rem;
    }
    .user-chip img { width: 28px; height: 28px; border-radius: 50%; }

    .content { padding: 22px 24px 48px; max-width: 1180px; }

    /* Cards / forms */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 18px;
      margin-bottom: 14px;
    }
    .card-h {
      display: flex; align-items: flex-start; gap: 12px;
      margin-bottom: 14px;
    }
    .card-h .ico {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent-2);
      display: grid; place-items: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .card-h h2 { margin: 0; font-size: 1.05rem; font-weight: 700; letter-spacing: -0.02em; }
    .card-h p { margin: 4px 0 0; color: var(--muted); font-size: 0.82rem; line-height: 1.45; }
    .card-h .status {
      margin-left: auto;
      font-size: 0.72rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.05);
      color: var(--muted);
      white-space: nowrap;
    }
    .card-h .status.on { background: rgba(34,197,94,0.12); color: #86efac; }
    .card-h .status.off { background: rgba(255,255,255,0.04); color: var(--muted-2); }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label, label.lbl {
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      letter-spacing: 0.02em;
    }
    input[type=text], input[type=number], input[type=url], input[type=color],
    input[type=password], select, textarea {
      background: #0e0e10;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-border);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    textarea { min-height: 80px; resize: vertical; }
    .hint { font-size: 0.78rem; color: var(--muted-2); margin: 6px 0 0; line-height: 1.4; }
    .hint code {
      background: rgba(255,255,255,0.06);
      padding: 1px 6px; border-radius: 5px;
      font-size: 0.76rem;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-card-2);
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn:hover { border-color: var(--border-strong); background: #222226; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #ff8f66);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 4px 16px rgba(242,107,71,0.25);
    }
    .btn-primary:hover { filter: brightness(1.06); color: #fff; }
    .btn-ghost { background: transparent; }

    .switch {
      position: relative; width: 44px; height: 24px; display: inline-block;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .switch .slider {
      position: absolute; inset: 0;
      background: #2a2a2e;
      border-radius: 999px;
      cursor: pointer;
      transition: 0.2s;
    }
    .switch .slider:before {
      content: "";
      position: absolute; width: 18px; height: 18px;
      left: 3px; top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider {
      background: linear-gradient(135deg, var(--accent), #ff8f66);
    }
    .switch input:checked + .slider:before { transform: translateX(20px); }

    .toast {
      position: fixed; top: 18px; right: 18px; z-index: 9999;
      background: #121214;
      border: 1px solid var(--accent-border);
      color: #fff;
      padding: 12px 16px;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.45);
      font-size: 0.88rem;
      display: none;
      align-items: center; gap: 8px;
    }
    .toast.show { display: flex; animation: slideIn 0.25s ease; }
    @keyframes slideIn {
      from { transform: translateY(-8px); opacity: 0; }
      to { transform: none; opacity: 1; }
    }

    .alert {
      padding: 12px 14px; border-radius: 12px; margin-bottom: 14px;
      font-size: 0.88rem;
    }
    .alert-ok { background: rgba(34,197,94,0.12); color: #86efac; border: 1px solid rgba(34,197,94,0.25); }
    .alert-err { background: rgba(239,68,68,0.12); color: #fca5a5; border: 1px solid rgba(239,68,68,0.25); }

    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .mod-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    @media (min-width: 900px) {
      .mod-grid.two { grid-template-columns: 1fr 1fr; }
    }

    /* Mobile */
    .menu-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 12px;
      font-weight: 600;
    }
    @media (max-width: 900px) {
      .sidebar {
        position: fixed; left: 0; top: 0;
        transform: translateX(-100%);
        transition: transform 0.2s;
      }
      .sidebar.open { transform: none; }
      .menu-btn { display: inline-flex; }
      .content { padding: 16px; }
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>
  {% block body %}
  <div class="shell">
    {% block sidebar %}{% endblock %}
    <div class="main">
      {% block topbar %}{% endblock %}
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  {% endblock %}
  <div id="odToast" class="toast">✅ Cambios guardados</div>
  <script>
    function showToast(msg) {
      var t = document.getElementById('odToast');
      if (!t) return;
      t.textContent = msg || '✅ Cambios guardados';
      t.classList.add('show');
      setTimeout(function(){ t.classList.remove('show'); }, 2200);
    }
    function toggleSidebar() {
      var s = document.querySelector('.sidebar');
      if (s) s.classList.toggle('open');
    }
    {% block extra_js %}{% endblock %}
  </script>
</body>
</html>
