{% extends "base.html" %}
{% block title %}Odette Panel{% endblock %}
{% block body %}
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(ellipse at 30% 20%,rgba(242,107,71,0.12),transparent 50%),var(--bg)">
  <div style="max-width:420px;width:100%;text-align:center">
    <div style="width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,var(--accent),#ff9a6b);display:grid;place-items:center;font-size:1.8rem">🦢</div>
    <h1 style="margin:0 0 8px;font-size:1.8rem;letter-spacing:-0.03em">Odette</h1>
    <p style="color:var(--muted);margin:0 0 24px;line-height:1.5">Panel de configuración del bot. Inicia sesión con Discord para gestionar tus servidores.</p>
    <a class="btn btn-primary" href="/login" style="padding:12px 28px;font-size:0.95rem">Entrar con Discord</a>
  </div>
</div>
{% endblock %}
