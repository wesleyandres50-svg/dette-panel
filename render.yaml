# Blueprint Render — Odette Panel
services:
  - type: web
    name: odette-panel
    runtime: python
    plan: free
    buildCommand: python3 -m venv .venv && .venv/bin/pip install -r requirements.txt
    startCommand: .venv/bin/uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: BOT_OWNER_ID
        value: "545930956721356842"
      - key: SECRET_KEY
        generateValue: true
